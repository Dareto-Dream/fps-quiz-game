<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Arena FPS - Controller</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="connection-screen">
    <div class="connection-box">
      <div class="screen-kicker">Controller Link</div>
      <h1>ARENA FPS</h1>

      <label class="field-label" for="server-url">Game Site</label>
      <input type="url" id="server-url" placeholder="https://fps-quiz-game-production.up.railway.app" autocomplete="url" inputmode="url">

      <label class="field-label" for="room-code">Room Code</label>
      <input type="text" id="room-code" placeholder="0000" maxlength="4" pattern="[0-9]{4}" inputmode="numeric" autocomplete="one-time-code">

      <button id="connect-btn" type="button">CONNECT</button>
      <div id="connection-error" role="alert"></div>
    </div>
  </div>

  <div id="lobby-wait-screen">
    <div class="wait-box">
      <div class="screen-kicker">Player Queue</div>
      <h1>STANDBY</h1>
      <div id="wait-room-code">----</div>
      <div class="wait-player">
        <div id="wait-player-color"></div>
        <div id="wait-player-name">Player</div>
      </div>
      <div class="wait-stats">
        <div>
          <span>Players</span>
          <strong id="wait-player-count">0/0</strong>
        </div>
        <div>
          <span>Match</span>
          <strong id="wait-match-length">5 min</strong>
        </div>
      </div>
      <div id="wait-status">Waiting for host...</div>
    </div>
  </div>

  <div id="game-screen">
    <canvas id="game-canvas"></canvas>
    <div id="crosshair" aria-hidden="true">
      <span class="crosshair-line crosshair-up"></span>
      <span class="crosshair-line crosshair-right"></span>
      <span class="crosshair-line crosshair-down"></span>
      <span class="crosshair-line crosshair-left"></span>
      <span class="crosshair-dot"></span>
    </div>

    <div id="hud">
      <div id="health-container">
        <div id="health-bar-bg">
          <div id="health-bar"></div>
        </div>
        <div id="health-text">HP 100</div>
      </div>
      <div id="timer-display">5:00</div>
      <div id="combat-readout">
        <div id="ammo-display">AMMO 15</div>
        <div id="stats-display">K/D 0/0<br>Streak 0</div>
      </div>
    </div>

    <div id="player-indicator">
      <div id="player-color"></div>
      <span id="player-name">Player</span>
    </div>

    <div class="joystick-area" id="left-joystick-area">
      <div class="joystick-base">
        <div class="joystick-handle" id="left-handle"></div>
      </div>
      <div class="joystick-label">MOVE</div>
    </div>

    <div class="joystick-area" id="right-joystick-area">
      <div class="joystick-base">
        <div class="joystick-handle" id="right-handle"></div>
      </div>
      <div class="joystick-label">LOOK</div>
    </div>

    <div id="fire-btn" role="button" aria-label="Fire">FIRE</div>
    <div id="reload-btn" role="button" aria-label="Reload">RLD</div>

    <div id="kill-notification" class="notification">KILL</div>
    <div id="ammo-notification" class="notification">+5 AMMO</div>

    <div id="death-screen">
      <h2>ELIMINATED</h2>
      <div>Killed by <span id="killer-name">Enemy</span></div>
      <div id="respawn-countdown">3</div>
    </div>

    <div id="quiz-modal">
      <div class="quiz-container">
        <h2>RELOAD QUIZ</h2>
        <div id="quiz-questions"></div>
        <button id="submit-quiz-btn" type="button" disabled>SUBMIT</button>
      </div>
    </div>

    <div id="match-end">
      <h1>MATCH OVER</h1>
      <div id="winner-info"></div>
      <div id="your-final-stats"></div>
    </div>
  </div>

  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="sketch.js"></script>
</body>
</html>
