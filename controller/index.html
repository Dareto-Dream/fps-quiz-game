<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Arena FPS - Controller</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    
    body {
      background: #1a1a2e;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }
    
    /* Connection Screen */
    #connection-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      z-index: 100;
    }
    
    .connection-box {
      background: rgba(255, 255, 255, 0.1);
      padding: 30px;
      border-radius: 15px;
      text-align: center;
      width: 90%;
      max-width: 350px;
    }
    
    .connection-box h1 {
      color: #ff6600;
      margin-bottom: 20px;
      font-size: 24px;
    }
    
    .connection-box input {
      width: 100%;
      padding: 15px;
      margin: 8px 0;
      border: none;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      font-size: 16px;
      text-align: center;
    }
    
    .connection-box input::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }
    
    .connection-box input:focus {
      outline: 2px solid #ff6600;
      background: rgba(255, 255, 255, 0.2);
    }
    
    #connect-btn {
      width: 100%;
      padding: 15px;
      margin-top: 15px;
      border: none;
      border-radius: 8px;
      background: #ff6600;
      color: #fff;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }
    
    #connect-btn:hover:not(:disabled) {
      background: #ff8533;
    }
    
    #connect-btn:disabled {
      background: #666;
      cursor: not-allowed;
    }
    
    #connection-error {
      color: #ff4444;
      margin-top: 15px;
      min-height: 20px;
      font-size: 14px;
    }
    
    .input-hint {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.5);
      margin-top: 5px;
    }
    
    /* Game Screen */
    #game-screen {
      display: none;
      width: 100%;
      height: 100%;
      position: relative;
    }
    
    #game-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    
    /* HUD */
    #hud {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 10px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
    }
    
    #health-container {
      width: 150px;
    }
    
    #health-bar-bg {
      width: 100%;
      height: 20px;
      background: rgba(0, 0, 0, 0.5);
      border-radius: 10px;
      overflow: hidden;
    }
    
    #health-bar {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #ff4444, #ff6666);
      transition: width 0.3s;
    }
    
    #health-text {
      text-align: center;
      font-size: 12px;
      margin-top: 2px;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
    }
    
    #timer-display {
      font-size: 24px;
      font-weight: bold;
      color: #ff6600;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
    }
    
    #ammo-display {
      font-size: 20px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
    }
    
    #stats-display {
      font-size: 14px;
      text-align: right;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
    }
    
    /* Player indicator */
    #player-indicator {
      position: absolute;
      top: 50px;
      left: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: none;
    }
    
    #player-color {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid #fff;
    }
    
    #player-name {
      font-size: 16px;
      font-weight: bold;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
    }
    
    /* Joystick Areas */
    .joystick-area {
      position: absolute;
      bottom: 20px;
      width: 140px;
      height: 140px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    
    #left-joystick-area {
      left: 20px;
    }
    
    #right-joystick-area {
      right: 20px;
    }
    
    .joystick-base {
      width: 120px;
      height: 120px;
      background: rgba(255, 255, 255, 0.15);
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      position: relative;
    }
    
    .joystick-handle {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 50px;
      height: 50px;
      background: rgba(255, 102, 0, 0.8);
      border-radius: 50%;
      border: 2px solid #fff;
    }
    
    .joystick-label {
      position: absolute;
      bottom: -25px;
      width: 100%;
      text-align: center;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.6);
    }
    
    /* Action Buttons */
    #fire-btn {
      position: absolute;
      bottom: 180px;
      right: 40px;
      width: 80px;
      height: 80px;
      background: #ff4444;
      border: 3px solid #fff;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 24px;
      font-weight: bold;
      color: #fff;
      cursor: pointer;
      transition: transform 0.1s, background 0.1s;
    }
    
    #fire-btn.active {
      transform: scale(0.9);
      background: #ff6666;
    }
    
    #reload-btn {
      position: absolute;
      bottom: 180px;
      left: 40px;
      width: 60px;
      height: 60px;
      background: #4444ff;
      border: 2px solid #fff;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 20px;
      color: #fff;
      cursor: pointer;
    }
    
    /* Notifications */
    .notification {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 36px;
      font-weight: bold;
      text-shadow: 3px 3px 6px rgba(0,0,0,0.8);
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }
    
    #kill-notification {
      color: #00ff00;
    }
    
    #ammo-notification {
      color: #00ffff;
    }
    
    /* Death Screen */
    #death-screen {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(139, 0, 0, 0.7);
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 50;
    }
    
    #death-screen h2 {
      font-size: 48px;
      color: #fff;
      margin-bottom: 20px;
    }
    
    #killer-name {
      font-size: 24px;
      color: #ff6600;
      margin-bottom: 30px;
    }
    
    #respawn-countdown {
      font-size: 72px;
      color: #fff;
    }
    
    /* Quiz Modal */
    #quiz-modal {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      justify-content: center;
      align-items: center;
      z-index: 60;
      overflow-y: auto;
      padding: 20px;
    }
    
    .quiz-container {
      background: #2a2a4a;
      padding: 20px;
      border-radius: 15px;
      max-width: 400px;
      width: 100%;
    }
    
    .quiz-container h2 {
      text-align: center;
      color: #ff6600;
      margin-bottom: 20px;
    }
    
    .quiz-question {
      margin-bottom: 20px;
    }
    
    .question-text {
      font-size: 16px;
      margin-bottom: 10px;
    }
    
    .quiz-option {
      display: block;
      width: 100%;
      padding: 12px;
      margin: 5px 0;
      background: rgba(255, 255, 255, 0.1);
      border: 2px solid transparent;
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
      text-align: left;
    }
    
    .quiz-option.selected {
      border-color: #ff6600;
      background: rgba(255, 102, 0, 0.3);
    }
    
    #submit-quiz-btn {
      width: 100%;
      padding: 15px;
      background: #ff6600;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    
    #submit-quiz-btn:disabled {
      background: #666;
      cursor: not-allowed;
    }
    
    /* Match End */
    #match-end {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 70;
    }
    
    #match-end h1 {
      font-size: 36px;
      color: #ff6600;
      margin-bottom: 20px;
    }
    
    #winner-info {
      font-size: 24px;
      margin-bottom: 15px;
    }
    
    #your-final-stats {
      font-size: 18px;
      color: rgba(255, 255, 255, 0.7);
    }
  </style>
</head>
<body>
  <!-- Connection Screen -->
  <div id="connection-screen">
    <div class="connection-box">
      <h1>🎮 ARENA FPS</h1>
      <input type="url" id="server-url" placeholder="Server URL">
      <div class="input-hint">e.g., https://your-server.com</div>
      <input type="text" id="room-code" placeholder="Room Code (4 digits)" maxlength="4" pattern="[0-9]{4}">
      <button id="connect-btn">CONNECT</button>
      <div id="connection-error"></div>
    </div>
  </div>
  
  <!-- Game Screen -->
  <div id="game-screen">
    <canvas id="game-canvas"></canvas>
    
    <!-- HUD -->
    <div id="hud">
      <div id="health-container">
        <div id="health-bar-bg">
          <div id="health-bar"></div>
        </div>
        <div id="health-text">HP: 100</div>
      </div>
      <div id="timer-display">5:00</div>
      <div>
        <div id="ammo-display">⚡ 15</div>
        <div id="stats-display">K/D: 0/0<br>Streak: 0</div>
      </div>
    </div>
    
    <!-- Player indicator -->
    <div id="player-indicator">
      <div id="player-color"></div>
      <span id="player-name">Player</span>
    </div>
    
    <!-- Joysticks -->
    <div class="joystick-area" id="left-joystick-area">
      <div class="joystick-base">
        <div class="joystick-handle" id="left-handle"></div>
      </div>
      <div class="joystick-label">MOVE</div>
    </div>
    
    <div class="joystick-area" id="right-joystick-area">
      <div class="joystick-base">
        <div class="joystick-handle" id="right-handle"></div>
      </div>
      <div class="joystick-label">LOOK</div>
    </div>
    
    <!-- Action Buttons -->
    <div id="fire-btn">🔥</div>
    <div id="reload-btn">🔄</div>
    
    <!-- Notifications -->
    <div id="kill-notification" class="notification">KILL!</div>
    <div id="ammo-notification" class="notification">+5 AMMO</div>
    
    <!-- Death Screen -->
    <div id="death-screen">
      <h2>☠️ YOU DIED</h2>
      <div>Killed by: <span id="killer-name">Enemy</span></div>
      <div id="respawn-countdown">3</div>
    </div>
    
    <!-- Quiz Modal -->
    <div id="quiz-modal">
      <div class="quiz-container">
        <h2>📚 RELOAD QUIZ</h2>
        <div id="quiz-questions"></div>
        <button id="submit-quiz-btn" disabled>SUBMIT</button>
      </div>
    </div>
    
    <!-- Match End -->
    <div id="match-end">
      <h1>🏆 MATCH OVER</h1>
      <div id="winner-info"></div>
      <div id="your-final-stats"></div>
    </div>
  </div>
  
  <!-- Socket.io -->
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  
  <!-- Three.js -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  
  <script type="module" src="sketch.js"></script>
</body>
</html>
