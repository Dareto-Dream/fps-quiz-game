<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Arena FPS - Controller</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-touch-callout: none;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1a1a2e;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    :root {
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --hud-padding: clamp(12px, 2.5vw, 20px);
      --joystick-size: clamp(110px, 22vw, 160px);
      --joystick-base-size: clamp(90px, 18vw, 130px);
      --joystick-handle-size: clamp(40px, 10vw, 60px);
      --action-button-size: clamp(64px, 14vw, 90px);
      --reload-button-width: clamp(56px, 12vw, 78px);
      --reload-button-height: clamp(36px, 7vw, 48px);
      --button-gap: clamp(12px, 2vw, 18px);
    }
    
    #game-container {
      width: 100%;
      height: 100dvh;
      min-height: 100svh;
      position: relative;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }
    
    #game-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    
    #hud-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    
    #hud-overlay > * {
      pointer-events: auto;
    }
    
    /* Allow normal interaction on form elements */
    input, button, .quiz-option {
      touch-action: auto;
      -webkit-user-select: auto;
      user-select: auto;
    }
    
    #quiz-modal {
      touch-action: pan-y;
      -webkit-overflow-scrolling: touch;
    }
    
    #connection-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: 20px;
    }
    
    #connection-screen h1 {
      color: #00d4ff;
      font-size: 32px;
      margin-bottom: 30px;
    }
    
    .input-group {
      margin-bottom: 20px;
      width: 100%;
      max-width: 300px;
    }
    
    .input-group label {
      display: block;
      color: #888;
      font-size: 14px;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }
    
    .input-group input {
      width: 100%;
      padding: 15px;
      font-size: 20px;
      background: #2a2a4a;
      border: 2px solid #444;
      border-radius: 10px;
      color: white;
      text-align: center;
    }
    
    .input-group input:focus {
      outline: none;
      border-color: #00d4ff;
    }
    
    #connect-btn {
      width: 100%;
      max-width: 300px;
      padding: 18px;
      font-size: 22px;
      font-weight: bold;
      background: #00d4ff;
      color: black;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 10px;
    }
    
    #connect-btn:active {
      background: #00a0cc;
    }
    
    #connect-btn:disabled {
      background: #444;
      color: #888;
    }
    
    #connection-error {
      color: #ff4444;
      margin-top: 15px;
      text-align: center;
    }
    
    #game-screen {
      display: none;
      width: 100%;
      height: 100%;
      position: relative;
    }
    
    /* HUD Elements */
    #health-bar-container {
      position: absolute;
      top: calc(var(--hud-padding) + var(--safe-top));
      left: calc(var(--hud-padding) + var(--safe-left));
      width: clamp(120px, 24vw, 170px);
      pointer-events: none;
    }
    
    #health-bar-bg {
      width: 100%;
      height: 20px;
      background: rgba(60, 60, 80, 0.8);
      border-radius: 5px;
    }
    
    #health-bar {
      height: 100%;
      background: linear-gradient(90deg, #ff4444, #44ff44);
      border-radius: 5px;
      transition: width 0.2s;
    }
    
    #health-text {
      color: white;
      font-size: 12px;
      margin-top: 2px;
    }
    
    #ammo-display {
      position: absolute;
      top: calc(var(--hud-padding) + var(--safe-top) + 30px);
      left: calc(var(--hud-padding) + var(--safe-left));
      color: white;
      font-size: clamp(16px, 4vw, 20px);
      pointer-events: none;
    }
    
    #stats-display {
      position: absolute;
      bottom: calc(var(--hud-padding) + var(--safe-bottom));
      right: calc(var(--hud-padding) + var(--safe-right));
      color: white;
      font-size: clamp(12px, 3.5vw, 16px);
      text-align: right;
      pointer-events: none;
    }
    
    #timer-display {
      position: absolute;
      top: calc(var(--hud-padding) + var(--safe-top));
      left: 50%;
      transform: translateX(-50%);
      color: #ff6600;
      font-size: clamp(18px, 4.5vw, 26px);
      font-weight: bold;
      pointer-events: none;
    }
    
    #player-indicator {
      position: absolute;
      top: calc(var(--hud-padding) + var(--safe-top));
      right: calc(var(--hud-padding) + var(--safe-right));
      display: flex;
      align-items: center;
      pointer-events: none;
    }
    
    #player-color {
      width: 25px;
      height: 25px;
      border-radius: 50%;
      margin-left: 8px;
    }
    
    #player-name {
      color: white;
      font-size: 14px;
    }
    
    /* Crosshair */
    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    
    #crosshair::before, #crosshair::after {
      content: '';
      position: absolute;
      background: rgba(255, 255, 255, 0.8);
    }
    
    #crosshair::before {
      width: 20px;
      height: 2px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
    
    #crosshair::after {
      width: 2px;
      height: 20px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
    
    /* Joysticks */
    .joystick-area {
      position: absolute;
      bottom: calc(var(--hud-padding) + var(--safe-bottom));
      width: var(--joystick-size);
      height: var(--joystick-size);
      pointer-events: auto;
      touch-action: none;
    }
    
    #left-joystick-area {
      left: calc(var(--hud-padding) + var(--safe-left));
    }
    
    #right-joystick-area {
      right: calc(var(--hud-padding) + var(--safe-right));
    }
    
    .joystick-base {
      position: absolute;
      width: var(--joystick-base-size);
      height: var(--joystick-base-size);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      border: 2px solid rgba(255, 255, 255, 0.3);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
    
    .joystick-handle {
      position: absolute;
      width: var(--joystick-handle-size);
      height: var(--joystick-handle-size);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.5);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      transition: none;
    }
    
    .joystick-label {
      position: absolute;
      top: -20px;
      width: 100%;
      text-align: center;
      color: rgba(255, 255, 255, 0.5);
      font-size: 12px;
    }
    
    /* Fire button */
    #fire-btn {
      position: absolute;
      bottom: calc(var(--hud-padding) + var(--safe-bottom) + var(--joystick-size) + var(--button-gap));
      right: calc(var(--hud-padding) + var(--safe-right));
      width: var(--action-button-size);
      height: var(--action-button-size);
      border-radius: 50%;
      background: rgba(200, 50, 50, 0.8);
      border: 3px solid rgba(255, 100, 100, 0.8);
      color: white;
      font-size: 16px;
      font-weight: bold;
      pointer-events: auto;
    }
    
    #fire-btn:active, #fire-btn.active {
      background: rgba(255, 80, 80, 0.9);
    }
    
    /* Reload button */
    #reload-btn {
      position: absolute;
      bottom: calc(var(--hud-padding) + var(--safe-bottom) + var(--joystick-size) + var(--action-button-size) + (var(--button-gap) * 2));
      right: calc(var(--hud-padding) + var(--safe-right) + 6px);
      width: var(--reload-button-width);
      height: var(--reload-button-height);
      border-radius: 8px;
      background: rgba(50, 150, 50, 0.8);
      border: 2px solid rgba(100, 200, 100, 0.8);
      color: white;
      font-size: 12px;
      font-weight: bold;
      pointer-events: auto;
    }
    
    /* Notifications */
    #kill-notification {
      position: absolute;
      top: 30%;
      left: 50%;
      transform: translateX(-50%);
      color: yellow;
      font-size: 36px;
      font-weight: bold;
      text-shadow: 0 0 10px rgba(0,0,0,0.8);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s;
    }
    
    #ammo-notification {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #00ff88;
      font-size: 28px;
      font-weight: bold;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s;
    }
    
    /* Quiz Modal */
    #quiz-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.95);
      z-index: 100;
      padding: 20px;
      overflow-y: auto;
    }
    
    #quiz-content {
      max-width: 500px;
      margin: 0 auto;
    }
    
    #quiz-modal h2 {
      color: #00d4ff;
      text-align: center;
      margin-bottom: 20px;
      font-size: 24px;
    }
    
    .quiz-question {
      background: #2a2a4a;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
    }
    
    .quiz-question .question-text {
      color: white;
      font-size: 18px;
      margin-bottom: 15px;
    }
    
    .quiz-option {
      display: block;
      width: 100%;
      padding: 15px;
      margin-bottom: 10px;
      background: #3a3a5a;
      border: 2px solid #555;
      border-radius: 8px;
      color: white;
      font-size: 16px;
      text-align: left;
      cursor: pointer;
    }
    
    .quiz-option:active {
      background: #4a4a6a;
    }
    
    .quiz-option.selected {
      border-color: #00d4ff;
      background: #2a4a6a;
    }
    
    #submit-quiz-btn {
      width: 100%;
      padding: 18px;
      font-size: 20px;
      font-weight: bold;
      background: #00ff88;
      color: black;
      border: none;
      border-radius: 10px;
      margin-top: 20px;
    }
    
    #submit-quiz-btn:disabled {
      background: #444;
      color: #888;
    }
    
    /* Death Screen */
    #death-screen {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 0, 0, 0.4);
      z-index: 50;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }
    
    #death-screen h1 {
      color: white;
      font-size: 48px;
      text-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
    }
    
    #death-screen .killed-by {
      color: white;
      font-size: 24px;
      margin-top: 10px;
    }
    
    #respawn-countdown {
      color: white;
      font-size: 72px;
      margin-top: 20px;
    }
    
    /* Match End Screen */
    #match-end {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      z-index: 200;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      padding: 20px;
    }
    
    #match-end h1 {
      color: #ffd700;
      font-size: 36px;
      margin-bottom: 20px;
    }
    
    #match-end .winner-info {
      font-size: 24px;
      color: white;
      margin-bottom: 30px;
    }
    
    #match-end .your-stats {
      font-size: 20px;
      color: #00d4ff;
    }
  </style>
</head>
<body>
  <!-- Connection Screen -->
  <div id="connection-screen">
    <h1>🎮 Arena FPS</h1>
    
    <div class="input-group">
      <label>SERVER IP ADDRESS</label>
      <input type="text" id="server-ip" placeholder="192.168.1.100" inputmode="text">
    </div>
    
    <div class="input-group">
      <label>PORT</label>
      <input type="number" id="server-port" value="3000" inputmode="numeric">
    </div>
    
    <div class="input-group">
      <label>ROOM CODE</label>
      <input type="text" id="room-code" placeholder="1234" maxlength="4" inputmode="numeric">
    </div>
    
    <button id="connect-btn">CONNECT</button>
    
    <div id="connection-error"></div>
  </div>
  
  <!-- Game Screen -->
  <div id="game-screen">
    <div id="game-container">
      <canvas id="game-canvas"></canvas>
      
      <!-- HUD Overlay -->
      <div id="hud-overlay">
        <!-- Health -->
        <div id="health-bar-container">
          <div id="health-bar-bg">
            <div id="health-bar" style="width: 100%"></div>
          </div>
          <div id="health-text">HP: 100</div>
        </div>
        
        <!-- Ammo -->
        <div id="ammo-display">⚡ 15</div>
        
        <!-- Timer -->
        <div id="timer-display">5:00</div>
        
        <!-- Player indicator -->
        <div id="player-indicator">
          <span id="player-name">---</span>
          <div id="player-color"></div>
        </div>
        
        <!-- Stats -->
        <div id="stats-display">
          K/D: 0/0<br>
          Streak: 0
        </div>
        
        <!-- Crosshair -->
        <div id="crosshair"></div>
        
        <!-- Joysticks -->
        <div id="left-joystick-area" class="joystick-area">
          <div class="joystick-label">MOVE</div>
          <div class="joystick-base"></div>
          <div class="joystick-handle" id="left-handle"></div>
        </div>
        
        <div id="right-joystick-area" class="joystick-area">
          <div class="joystick-label">LOOK</div>
          <div class="joystick-base"></div>
          <div class="joystick-handle" id="right-handle"></div>
        </div>
        
        <!-- Fire button -->
        <button id="fire-btn">FIRE</button>
        
        <!-- Reload button -->
        <button id="reload-btn">RELOAD</button>
        
        <!-- Notifications -->
        <div id="kill-notification">KILL!</div>
        <div id="ammo-notification">+5 AMMO</div>
      </div>
    </div>
  </div>
  
  <!-- Quiz Modal -->
  <div id="quiz-modal">
    <div id="quiz-content">
      <h2>📚 AMMO QUIZ</h2>
      <div id="quiz-questions"></div>
      <button id="submit-quiz-btn" disabled>SUBMIT ANSWERS</button>
    </div>
  </div>
  
  <!-- Death Screen -->
  <div id="death-screen">
    <h1>YOU DIED</h1>
    <div class="killed-by">Killed by <span id="killer-name">---</span></div>
    <div id="respawn-countdown">3</div>
  </div>
  
  <!-- Match End Screen -->
  <div id="match-end">
    <h1>MATCH OVER</h1>
    <div class="winner-info" id="winner-info"></div>
    <div class="your-stats" id="your-final-stats"></div>
  </div>
  
  <!-- Scripts -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script type="module" src="sketch.js"></script>
</body>
</html>
